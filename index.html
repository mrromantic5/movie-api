<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>GiftedFlix — Premium Movie Stream</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #0a0a0a;
      font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      color: #ffffff;
      overflow-x: hidden;
    }

    /* netflix-like gradient & overlay */
    .hero {
      background: linear-gradient(135deg, #000000 0%, #0f0f1f 100%);
      padding: 1.5rem 3rem 4rem 3rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
      margin-bottom: 3rem;
    }

    .logo {
      font-size: 1.9rem;
      font-weight: 800;
      background: linear-gradient(135deg, #e50914, #b20710);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      letter-spacing: -0.5px;
    }

    .search-area {
      display: flex;
      gap: 0.75rem;
      background: rgba(20, 20, 30, 0.7);
      backdrop-filter: blur(12px);
      padding: 0.4rem 0.4rem 0.4rem 1rem;
      border-radius: 60px;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .search-area input {
      background: transparent;
      border: none;
      padding: 0.6rem 0.2rem;
      font-size: 1rem;
      color: white;
      width: 240px;
      outline: none;
    }

    .search-area input::placeholder {
      color: #aaa;
    }

    .search-area button {
      background: #e50914;
      border: none;
      padding: 0.5rem 1.2rem;
      border-radius: 40px;
      font-weight: 600;
      color: white;
      cursor: pointer;
      transition: 0.2s;
    }

    .search-area button:hover {
      background: #f6121d;
      transform: scale(0.97);
    }

    .section-title {
      font-size: 1.7rem;
      font-weight: 600;
      margin: 2rem 3rem 1rem 3rem;
      letter-spacing: -0.3px;
      border-left: 5px solid #e50914;
      padding-left: 1rem;
    }

    .movies-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
      gap: 1.8rem;
      padding: 0 3rem 3rem 3rem;
    }

    .movie-card {
      background: #141414;
      border-radius: 16px;
      overflow: hidden;
      transition: transform 0.25s ease, box-shadow 0.2s;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(0,0,0,0.6);
      position: relative;
    }

    .movie-card:hover {
      transform: scale(1.03);
      box-shadow: 0 15px 30px rgba(229, 9, 20, 0.3);
    }

    .poster-img {
      width: 100%;
      aspect-ratio: 2 / 3;
      object-fit: cover;
      background: #1e1e2a;
    }

    .card-info {
      padding: 0.8rem;
    }

    .card-info h3 {
      font-size: 1rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-info p {
      font-size: 0.8rem;
      color: #b3b3b3;
      margin-top: 0.3rem;
      display: flex;
      justify-content: space-between;
    }

    .badge {
      background: #e50914;
      padding: 0.2rem 0.6rem;
      border-radius: 20px;
      font-size: 0.7rem;
      font-weight: bold;
    }

    .actions {
      display: flex;
      gap: 0.5rem;
      margin-top: 0.6rem;
    }

    .btn-icon {
      background: rgba(255,255,255,0.1);
      border: none;
      padding: 0.4rem 0.8rem;
      border-radius: 30px;
      color: white;
      font-size: 0.7rem;
      font-weight: 500;
      cursor: pointer;
      transition: 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .btn-play {
      background: #e50914;
    }
    .btn-play:hover {
      background: #ff1a26;
    }
    .btn-download {
      background: #2c2c3a;
    }
    .btn-download:hover {
      background: #3a3a4e;
    }

    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.95);
      backdrop-filter: blur(10px);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      background: #111;
      max-width: 800px;
      width: 90%;
      border-radius: 28px;
      overflow-y: auto;
      max-height: 85vh;
      padding: 1.5rem;
      border: 1px solid #333;
      box-shadow: 0 25px 40px rgba(0,0,0,0.8);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 1rem;
    }

    .close-modal {
      background: none;
      border: none;
      color: white;
      font-size: 1.8rem;
      cursor: pointer;
    }

    .quality-links {
      background: #1a1a1a;
      border-radius: 16px;
      padding: 1rem;
      margin: 1rem 0;
    }

    .quality-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 15px 0;
    }
    .quality-btn {
      background: #2c2c2c;
      border: none;
      padding: 8px 14px;
      border-radius: 40px;
      color: white;
      font-weight: 500;
      cursor: pointer;
    }
    .loading {
      text-align: center;
      padding: 2rem;
      color: #aaa;
    }
    footer {
      text-align: center;
      padding: 2rem;
      font-size: 0.8rem;
      color: #4a4a5a;
      border-top: 1px solid #202020;
    }
    @media (max-width: 700px) {
      .hero { padding: 1rem 1rem 2rem 1rem; }
      .movies-grid { padding: 0 1rem 2rem 1rem; gap: 1rem; }
      .section-title { margin: 1.5rem 1rem 1rem 1rem; }
      .search-area input { width: 140px; }
    }
  </style>
</head>
<body>

<div class="hero">
  <div class="navbar">
    <div class="logo">🎬 GIFTEDFLIX</div>
    <div class="search-area">
      <input type="text" id="searchInput" placeholder="Search movies, series..." value="Avatar">
      <button id="searchBtn">Search</button>
    </div>
  </div>
  <div style="text-align: center; margin: 1rem auto 0 auto; max-width: 700px;">
    <h2 style="font-size: 2rem; font-weight: 700;">Unlimited Movies & Series</h2>
    <p style="color: #ccc;">Stream, Download, Dubs & Subtitles — SaaS-grade API integration</p>
  </div>
</div>

<h2 class="section-title" id="sectionTitle">🔥 Trending Now</h2>
<div id="moviesContainer" class="movies-grid">
  <div class="loading">Loading premium content...</div>
</div>

<!-- Modal for details + sources -->
<div id="modal" class="modal">
  <div class="modal-content">
    <div class="modal-header">
      <h2 id="modalTitle">Movie Info</h2>
      <button class="close-modal" id="closeModalBtn">✕</button>
    </div>
    <div id="modalBody">
      <p>Loading details...</p>
    </div>
  </div>
</div>

<footer>
  Gifted Movies API v2.0 | Premium Test Platform | Bearer Auth Secured
</footer>

<script>
  // ======================= CONFIGURATION =======================
  const API_BASE = "https://movieapi.gifted.co.ke/api/v2";
  const API_KEY = "gifted_movieapi_789fbud2389889dg8962e098g23d6";
  
  // Helper fetch with auth headers
  async function apiFetch(endpoint) {
    const url = endpoint.startsWith('http') ? endpoint : `${API_BASE}${endpoint}`;
    const response = await fetch(url, {
      headers: {
        'Authorization': `Bearer ${API_KEY}`,
        'Content-Type': 'application/json'
      }
    });
    if (!response.ok) {
      const errText = await response.text();
      throw new Error(`API Error ${response.status}: ${errText.slice(0, 100)}`);
    }
    return response.json();
  }

  // DOM elements
  const moviesContainer = document.getElementById('moviesContainer');
  const sectionTitleSpan = document.getElementById('sectionTitle');
  const searchInput = document.getElementById('searchInput');
  const searchBtn = document.getElementById('searchBtn');
  const modal = document.getElementById('modal');
  const modalTitle = document.getElementById('modalTitle');
  const modalBody = document.getElementById('modalBody');
  const closeModalBtn = document.getElementById('closeModalBtn');

  let currentSearchQuery = "";

  // Helper: render movie cards from array
  function renderMovies(movies, titleContext = "Trending") {
    if (!movies || movies.length === 0) {
      moviesContainer.innerHTML = `<div style="grid-column:1/-1; text-align:center; padding:3rem;">✨ No results found. Try different keyword.</div>`;
      return;
    }
    sectionTitleSpan.innerText = titleContext;
    moviesContainer.innerHTML = movies.map(movie => {
      const poster = movie.poster || movie.image || movie.thumbnail || (movie.cover ? movie.cover : "https://via.placeholder.com/300x450?text=No+Poster");
      const year = movie.releaseDate ? movie.releaseDate.split('-')[0] : (movie.year || "2024");
      const rating = movie.rating || movie.voteAverage || "★";
      return `
        <div class="movie-card" data-id="${movie.id}" data-title="${escapeHtml(movie.title)}">
          <img class="poster-img" src="${poster}" alt="${movie.title}" onerror="this.src='https://placehold.co/300x450?text=Poster+Missing'">
          <div class="card-info">
            <h3>${escapeHtml(movie.title)}</h3>
            <p><span>${year}</span> <span class="badge">${typeof rating === 'number' ? rating.toFixed(1) : rating}</span></p>
            <div class="actions">
              <button class="btn-icon btn-play" data-id="${movie.id}" data-action="play">▶ Play / Stream</button>
              <button class="btn-icon btn-download" data-id="${movie.id}" data-action="download">⬇ Download</button>
            </div>
          </div>
        </div>
      `;
    }).join('');

    // Attach event listeners for each card buttons
    document.querySelectorAll('.btn-play').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const id = btn.getAttribute('data-id');
        openMovieModal(id, 'play');
      });
    });
    document.querySelectorAll('.btn-download').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const id = btn.getAttribute('data-id');
        openMovieModal(id, 'download');
      });
    });
    // card click for detailed info (optional)
    document.querySelectorAll('.movie-card').forEach(card => {
      card.addEventListener('click', (e) => {
        if (e.target.tagName === 'BUTTON') return;
        const id = card.getAttribute('data-id');
        if(id) openMovieModal(id, 'info');
      });
    });
  }

  function escapeHtml(str) { return String(str).replace(/[&<>]/g, function(m){if(m==='&') return '&amp;'; if(m==='<') return '&lt;'; if(m==='>') return '&gt;'; return m;}); }

  // ----- FETCH TRENDING -----
  async function loadTrending() {
    try {
      moviesContainer.innerHTML = '<div class="loading">Loading trending blockbusters...</div>';
      const data = await apiFetch('/trending');
      // API can return { results: [] } or direct array, adapt
      let trendingMovies = [];
      if (Array.isArray(data)) trendingMovies = data;
      else if (data.results && Array.isArray(data.results)) trendingMovies = data.results;
      else if (data.data && Array.isArray(data.data)) trendingMovies = data.data;
      else trendingMovies = [];
      if(trendingMovies.length === 0) throw new Error("No trending data");
      renderMovies(trendingMovies, "🔥 Trending Now");
    } catch (err) {
      console.error(err);
      moviesContainer.innerHTML = `<div style="grid-column:1/-1; text-align:center; padding:2rem;">⚠️ Failed to load trending. Check API key or network. <br> ${err.message}</div>`;
      // fallback to search avatar
      performSearch("Avatar");
    }
  }

  // ----- SEARCH -----
  async function performSearch(query) {
    if (!query.trim()) return;
    currentSearchQuery = query.trim();
    try {
      moviesContainer.innerHTML = '<div class="loading">Searching premium library...</div>';
      const searchUrl = `/search/${encodeURIComponent(currentSearchQuery)}?page=1`;
      const data = await apiFetch(searchUrl);
      let results = [];
      if (Array.isArray(data)) results = data;
      else if (data.results && Array.isArray(data.results)) results = data.results;
      else if (data.data && Array.isArray(data.data)) results = data.data;
      else results = [];
      if (results.length === 0) throw new Error("No results");
      renderMovies(results, `Search: "${currentSearchQuery}"`);
    } catch (err) {
      console.warn(err);
      moviesContainer.innerHTML = `<div style="grid-column:1/-1; text-align:center;">No movies found for "${escapeHtml(currentSearchQuery)}". Try another.</div>`;
    }
  }

  // ---------- MODAL: show INFO / SOURCES / CAPTIONS + AUDIO DUBS (PREMIUM FEATURE) ----------
  async function openMovieModal(movieId, actionType) {
    modal.style.display = "flex";
    modalBody.innerHTML = `<div class="loading">Fetching movie metadata & sources...</div>`;
    try {
      // 1. fetch movie info
      const info = await apiFetch(`/info/${movieId}`);
      const movieTitle = info.title || info.name || "Movie";
      modalTitle.innerText = movieTitle;
      
      let html = `<div style="margin-bottom: 1rem;"><strong>⭐ ${info.voteAverage || 'N/A'}</strong> | ${info.releaseDate || 'Unknown'} | ${info.runtime ? info.runtime+' min' : ''}</div>`;
      html += `<p>${info.overview || "No description available."}</p>`;
      if (info.genres) html += `<div style="margin: 1rem 0;"><strong>Genres:</strong> ${Array.isArray(info.genres) ? info.genres.map(g=>g.name||g).join(', ') : info.genres}</div>`;
      
      // 2. fetch sources (download / stream links)
      html += `<div class="quality-links"><strong>📥 Download / Stream Sources (multiple qualities)</strong><div class="quality-buttons" id="sourcesButtons">Loading sources...</div></div>`;
      
      // also check audio dubs capability later
      let sourcesData = null;
      try {
        sourcesData = await apiFetch(`/sources/${movieId}`);
      } catch(e) { console.warn("sources not found for id", e); sourcesData = null; }
      
      const sourcesDiv = document.createElement('div');
      if(sourcesData && (sourcesData.download || sourcesData.streams || sourcesData.sources || Array.isArray(sourcesData))) {
        let qualitiesMap = [];
        // adapt different possible structures
        if(sourcesData.sources && Array.isArray(sourcesData.sources)) qualitiesMap = sourcesData.sources;
        else if(sourcesData.downloads && Array.isArray(sourcesData.downloads)) qualitiesMap = sourcesData.downloads;
        else if(sourcesData.streams && Array.isArray(sourcesData.streams)) qualitiesMap = sourcesData.streams;
        else if(Array.isArray(sourcesData)) qualitiesMap = sourcesData;
        
        // Also check audioTracks (dubs)
        let audioTracks = sourcesData.audioTracks || [];
        let dubHtml = '';
        if(audioTracks.length) {
          dubHtml = `<div style="margin-top: 1rem;"><strong>🎧 Audio Dubs Available:</strong><div style="display:flex; gap:8px; flex-wrap:wrap;">`;
          for(let track of audioTracks) {
            const lang = track.language || track.languageCode;
            const dubId = track.subjectId || track.id;
            if(dubId) {
              dubHtml += `<button class="quality-btn" data-dubid="${dubId}" data-lang="${lang}">🎙️ ${lang} Dub</button>`;
            }
          }
          dubHtml += `</div></div>`;
        }
        
        if(qualitiesMap.length) {
          let btnsHtml = '';
          for(let src of qualitiesMap) {
            let quality = src.quality || src.resolution || 'Auto';
            let url = src.url || src.link || src.download_url;
            if(url) {
              btnsHtml += `<a href="${url}" target="_blank" class="quality-btn" style="text-decoration:none; display:inline-block;">🎬 ${quality}</a>`;
            } else if(src.file) {
              btnsHtml += `<a href="${src.file}" target="_blank" class="quality-btn">🎬 ${quality}</a>`;
            }
          }
          if(btnsHtml) {
            document.getElementById('sourcesButtons') ? document.getElementById('sourcesButtons').innerHTML = btnsHtml + dubHtml : null;
          } else {
            document.getElementById('sourcesButtons') ? document.getElementById('sourcesButtons').innerHTML = '⚠️ No direct links. But streaming may work via third-party.' : null;
          }
        } else {
          document.getElementById('sourcesButtons') ? document.getElementById('sourcesButtons').innerHTML = 'No quality links, but check dub below.' + dubHtml : null;
        }
        // handle dubs click after render
        setTimeout(() => {
          document.querySelectorAll('[data-dubid]').forEach(btn => {
            btn.addEventListener('click', async (e) => {
              const dubSubjectId = btn.getAttribute('data-dubid');
              const langName = btn.getAttribute('data-lang') || 'Dub';
              modalBody.innerHTML += `<div class="loading">Fetching ${langName} dub streams...</div>`;
              try {
                const dubSources = await apiFetch(`/sources/${dubSubjectId}`);
                let dubLinksHtml = `<div style="margin-top:1rem; background:#1f1f2f; padding:1rem; border-radius: 20px;"><strong>🎙️ ${langName} Dub Links:</strong><div class="quality-buttons">`;
                let dubQualities = [];
                if(dubSources.sources && Array.isArray(dubSources.sources)) dubQualities = dubSources.sources;
                else if(Array.isArray(dubSources)) dubQualities = dubSources;
                for(let q of dubQualities) {
                  let url = q.url || q.link;
                  if(url) dubLinksHtml += `<a href="${url}" target="_blank" class="quality-btn">🔊 ${q.quality || 'Dub Stream'}</a>`;
                }
                dubLinksHtml += `</div></div>`;
                modalBody.insertAdjacentHTML('beforeend', dubLinksHtml);
              } catch(err) { modalBody.innerHTML += `<div>Failed to load dub: ${err.message}</div>`; }
            });
          });
        }, 50);
      } else {
        if(document.getElementById('sourcesButtons')) document.getElementById('sourcesButtons').innerHTML = 'No streaming/download sources found for this ID.';
      }
      
      // subtitles preview (captions) if we have streamId – but we can also search for first source streamId 
      html += `<div style="margin: 1rem 0 0.5rem;"><strong>📜 Subtitles / Captions</strong><div id="captionsPanel">Select quality above to fetch SRT...</div></div>`;
      modalBody.innerHTML = html;
      
      // If sources have stream objects, add captions handler (advanced)
      if(sourcesData && sourcesData.sources && sourcesData.sources.length) {
        const firstStreamId = sourcesData.sources[0].id || sourcesData.sources[0].streamId;
        if(firstStreamId) {
          setTimeout(() => {
            const captionsDiv = document.getElementById('captionsPanel');
            if(captionsDiv) {
              captionsDiv.innerHTML = `<button class="quality-btn" id="fetchSubsBtn">🔤 Fetch Subtitles (SRT)</button>`;
              document.getElementById('fetchSubsBtn')?.addEventListener('click', async () => {
                captionsDiv.innerHTML = "Loading subtitles...";
                try {
                  const caps = await apiFetch(`/captions/${movieId}/${firstStreamId}?format=MP4`);
                  let subsHtml = `<div><strong>Subtitles available:</strong><ul style="margin-top:8px;">`;
                  if(caps.results && caps.results.captions) {
                    caps.results.captions.forEach(cap => {
                      subsHtml += `<li>${cap.language} (${cap.languageCode}) - <a href="${cap.url}" target="_blank" style="color:#e50914;">Download .srt</a></li>`;
                    });
                  } else if(Array.isArray(caps)) {
                    caps.forEach(c => subsHtml += `<li>${c.language} - <a href="${c.url}" target="_blank">SRT</a></li>`);
                  } else subsHtml += `<li>No caption tracks</li>`;
                  subsHtml += `</ul></div>`;
                  captionsDiv.innerHTML = subsHtml;
                } catch(e) { captionsDiv.innerHTML = `Failed to fetch captions: ${e.message}`; }
              });
            }
          }, 100);
        }
      }
    } catch (err) {
      modalBody.innerHTML = `<div style="color:red;">Error loading movie: ${err.message}<br>Check if movie ID exists or API limits.</div>`;
      console.error(err);
    }
  }

  // Search & event binding
  searchBtn.addEventListener('click', () => {
    const query = searchInput.value.trim();
    if(query) performSearch(query);
  });
  searchInput.addEventListener('keypress', (e) => {
    if(e.key === 'Enter') performSearch(searchInput.value.trim());
  });
  
  closeModalBtn.addEventListener('click', () => {
    modal.style.display = 'none';
  });
  window.addEventListener('click', (e) => {
    if(e.target === modal) modal.style.display = 'none';
  });
  
  // init homepage with trending then also homepage endpoint data? showcase
  async function loadHomepageData() {
    try {
      // optional: hit /homepage to show extra carousel but we keep trending as main
      const hpData = await apiFetch('/homepage');
      // if custom sections exists we could extend but minimal netflix style is trending
      console.log("Homepage metadata ready", hpData);
    } catch(e) { console.log("homepage optional not critical"); }
    loadTrending();
  }
  
  loadHomepageData();
</script>
</body>
</html>
